name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catgpt.html'
      - 'index.html'
      - '.nojekyll'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test game
        run: |
          npm run build
          git diff --exit-code -- catgpt.html
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test mobile game in a browser
        run: python tests/mobile_v06.py
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html catgpt.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
